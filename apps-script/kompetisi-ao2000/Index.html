<style>

<script>
/* ===== LOGIKA KOMPETISI AO SKU 2000 (dipakai sama persis di server & form) ===== */
var METHODS = {own:'Rekening sendiri', titip:'Titip 1 rekening', co:'Rekening perusahaan'};
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function periodeLabel(p) { var m = /^(\d{4})-(\d{2})$/.exec(p || ''); return m ? BULAN[+m[2] - 1] + ' ' + m[1] : String(p || ''); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
function lastDay(p) { var m = /^(\d{4})-(\d{2})$/.exec(p || ''); if (!m) return ''; var d = new Date(Date.UTC(+m[1], +m[2], 0)); return p + '-' + pad2(d.getUTCDate()); }
function toISO(v) {
  if (v == null || v === '') return '';
  if (Object.prototype.toString.call(v) === '[object Date]') return isNaN(v) ? '' : v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
  var s = String(v).trim(), m;
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(s))) { var y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad2(+m[2]) + '-' + pad2(+m[1]); }
  return '';
}
function fmtDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
function normKode(v) { return String(v || '').trim().toUpperCase().replace(/\s+/g, ''); }
function kwList(s) { return String(s || '').split(',').map(function (w) { return w.trim().toUpperCase(); }).filter(String); }

/** SKU 2000 non Money Mouse: nama/kode barang memuat salah satu kata kunci & tidak memuat kata pengecualian */
function isSku2000(nama, kode, S) {
  var n = String(nama || '').toUpperCase(), k = String(kode || '').toUpperCase().trim();
  var inc = kwList(S.skuInclude || '4X10,40PCS'), exc = kwList(S.skuExclude || 'MONEY MOUSE');
  if (exc.some(function (w) { return n.indexOf(w) >= 0 || k === w; })) return false;
  return inc.some(function (w) { return n.indexOf(w) >= 0 || k === w; });
}


/* ===== KONVERSI SATUAN → DUS/KARTON ===== */
/** jenis satuan: 'dus' | 'pcs' | 'rcg' | '' (tidak dikenal). Kosong dianggap dus. */
function unitKind(u) {
  var s = String(u == null ? '' : u).trim().toUpperCase().replace(/[^A-Z]/g, '');
  if (!s) return 'dus';
  if (/^(DUS|DOS|DS|KRT|KARTON|CARTON|CTN|CT|KTN|BOX|BX)$/.test(s)) return 'dus';
  if (/^(PCS|PC|PCE|PIECE|BKS|BUNGKUS|SACHET|SCH|BIJI|BJ|EA)$/.test(s)) return 'pcs';
  if (/^(RCG|RENCENG|RENTENG|RC|RTG|RNC|STRIP|STR|PAK|PACK|PK)$/.test(s)) return 'rcg';
  return '';
}
/** isi per dus dari pengaturan khusus ("KATA=pcs:renceng; ...") atau dari nama barang (mis. 4X10 = 4 renceng × 10 pcs) */
function packOf(namaBarang, kodeBarang, S) {
  var n = String(namaBarang || '').toUpperCase(), k = String(kodeBarang || '').toUpperCase().trim();
  var rules = String((S && S.packRules) || '').split(';');
  for (var i = 0; i < rules.length; i++) {
    var m = /^\s*([^=]+?)\s*=\s*(\d+)\s*(?::\s*(\d+))?\s*$/.exec(rules[i]);
    if (m && (n.indexOf(m[1].toUpperCase()) >= 0 || k === m[1].toUpperCase())) return {pcs: +m[2], rcg: m[3] ? +m[3] : 0};
  }
  var x = /(\d+)\s*[X×]\s*(\d+)/.exec(n);
  if (x) return {pcs: +x[1] * +x[2], rcg: +x[1]};
  var p = /(\d+)\s*PCS/.exec(n);
  if (p) return {pcs: +p[1], rcg: 0};
  return {pcs: 0, rcg: 0};
}
/** qty dalam dus; null bila satuan / isi per dus tidak diketahui */
function toDus(qty, unit, namaBarang, kodeBarang, S) {
  var q = Number(qty) || 0, kind = unitKind(unit);
  if (kind === 'dus') return q;
  if (!kind) return null;
  var pk = packOf(namaBarang, kodeBarang, S), f = kind === 'pcs' ? pk.pcs : pk.rcg;
  return f > 0 ? q / f : null;
}
function fmtDus(x) { x = Math.round(Number(x || 0) * 100) / 100; return String(x).replace('.', ','); }

/**
 * Hitung AO SKU 2000 per salesman dari transaksi.
 * members: [{dist, tx:[{d:'YYYY-MM-DD', k:kodeOutlet, s:salesman, q:qty, v:nilai}]}]  (tx sudah difilter SKU 2000 non MM)
 * AO = jumlah outlet berbeda dengan pembelian bersih ≥ minimal karton (S.minDus) di periode, per salesman per distributor.
 * tx.q harus sudah dalam satuan dus.
 */
function computeAo(members, periode, S) {
  var out = [], minD = Number(S && S.minDus) || 1;
  members.forEach(function (m) {
    var by = {};
    (m.tx || []).forEach(function (t) {
      if (!t.d || t.d.slice(0, 7) !== periode) return;
      var s = String(t.s || '').trim() || '(tanpa salesman)', k = normKode(t.k);
      if (!k) return;
      var x = by[s] = by[s] || {outlets: {}, value: 0};
      x.outlets[k] = (x.outlets[k] || 0) + (Number(t.q) || 0);
      x.value += Number(t.v) || 0;
    });
    Object.keys(by).sort().forEach(function (s) {
      var x = by[s], ao = Object.keys(x.outlets).filter(function (k) { return x.outlets[k] >= minD - 1e-9; }).length;
      out.push({dist: m.dist, name: s, ao: ao, value: Math.round(x.value)});
    });
  });
  return out;
}

/**
 * Tentukan pemenang.
 * input.rows: [{dist, name, ao, value, target, pay}]
 * Syarat: target > 0 dan AO >= target. Pemenang = AO tertinggi; seri → nilai (Rp) SKU 2000 tertinggi.
 */
function computeKomp(input, S) {
  var prize = Number(S.prize) || 0;
  var rows = input.rows.map(function (r, i) {
    var t = Number(r.target) || 0, ao = Number(r.ao) || 0;
    return {i: i, dist: r.dist, name: r.name, ao: ao, value: Number(r.value) || 0, target: t, ach: t > 0 ? ao / t : 0,
      eligible: t > 0 && ao >= t, why: t <= 0 ? 'Target belum diisi' : ao < t ? 'AO di bawah target' : '', pay: r.pay || {m: 'own'}, winner: false, rank: 0, incentive: 0};
  });
  var order = rows.slice().sort(function (a, b) { return b.ao - a.ao || b.value - a.value || (a.name < b.name ? -1 : 1); });
  order.forEach(function (r, j) { r.rank = j + 1; });
  var elig = order.filter(function (r) { return r.eligible; });
  var win = elig[0] || null, tie = false;
  if (win) {
    win.winner = true; win.incentive = prize;
    tie = elig.length > 1 && elig[1].ao === win.ao && elig[1].value === win.value;
    if (elig.length > 1 && elig[1].ao === win.ao) win.tieNote = elig[1].value === win.value ? 'Seri penuh dengan ' + elig[1].name + ' — perlu keputusan admin' : 'AO sama dengan ' + elig[1].name + ', unggul nilai SKU 2000';
  }
  var list = win ? [{i: win.i, name: win.name, dist: win.dist, m: METHODS[win.pay.m] ? win.pay.m : 'own', bank: win.pay.bank || '', cab: win.pay.cab || '', an: win.pay.an || '', nom: prize}] : [];
  var titipSum = list.filter(function (x) { return x.m === 'titip'; }).reduce(function (a, x) { return a + x.nom; }, 0);
  var titipOn = titipSum > 0 && titipSum >= Number(S.titipThr);
  var agg = {nom: 0, tax: 0, net: 0};
  list.forEach(function (x) {
    x.rate = x.m === 'co' ? Number(S.coRate) : x.m === 'titip' ? (titipOn ? Number(S.titipRate) : 0) : 0;
    x.tax = Math.round(x.nom * x.rate / 100); x.net = x.nom - x.tax; x.flag = x.m === 'own' && x.nom >= Number(S.ownThr);
    agg.nom += x.nom; agg.tax += x.tax; agg.net += x.net;
  });
  return {rows: rows, order: order, winner: win, tie: tie, eligibleCount: elig.length,
    pay: {list: list, titipSum: titipSum, titipOn: titipOn, nom: agg.nom, tax: agg.tax, net: agg.net}, total: agg.nom, totalNet: agg.net};
}
/* ===== akhir logika kompetisi ===== */


var GS = (typeof google !== 'undefined' && google.script && google.script.run) ? google.script.run : null;
var PREVIEW = !GS;
var STORE = 'klaim-komp-ao2000-v1';
var S = null;
var head = {entry:'', distLain:'', periode:'', pengaju:'', kontak:'', code:''};
var FILES = {};          // dist -> parsed file
var extra = {};          // 'dist|salesman' -> {target, pay}
var C = null, AO = [];

var fmt = function(n){ return new Intl.NumberFormat('id-ID').format(Math.round(n||0)); };
var rp = function(n){ return 'Rp ' + fmt(n); };
var pct = function(x){ return (x*100).toLocaleString('id-ID',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; };
var rate = function(x){ return String(x).replace('.', ','); };

function boot(settings){

  if (!S.open) { $('app').innerHTML = '<div class="panel center"><h1>Form klaim sedang ditutup</h1><p class="sub">Silakan hubungi admin Harum Group.</p></div>'; return; }
  load(); renderShell();
}

    drop.ondragleave = function(){ drop.classList.remove('hover'); };

function loadXLSX(cb, fail){
  if (window.XLSX) return cb();
  var sc = document.createElement('script');
  sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
  sc.onload = cb; sc.onerror = fail;
  document.head.appendChild(sc);
}
function readFile(dist, i, f){
  var meta = document.querySelector('[data-meta="'+i+'"]');
  if (f.size > 10 * 1024 * 1024) { meta.innerHTML = '<span style="color:var(--bad)">File terlalu besar (maks. 10 MB). Export cukup periode kompetisi.</span>'; return; }
  meta.textContent = 'Membaca ' + f.name + '…';
  loadXLSX(function(){
    var fr = new FileReader();
    fr.onload = function(){
      setTimeout(function(){
        try {
          var buf = new Uint8Array(fr.result);
          var p = parseWorkbook(XLSX.read(buf, {type:'array', cellDates:false, dense:true}));
          var bin = ''; for (var j = 0; j < buf.length; j += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(j, j + 0x8000));
          p.fileName = f.name; p.b64 = btoa(bin);
          FILES[dist] = p;
          var all = entry().members.map(function(d){ return FILES[d]; });
          if (all.every(Boolean)) {
            var lastM = all.map(function(x){ return x.dataMax.slice(0,7); }).sort()[0];
            if (!head.periode || head.periode > lastM) head.periode = lastM;
            document.querySelector('[data-h="periode"]').value = head.periode;
          }
          renderSlots(); recompute(); save();
        } catch (e) { meta.innerHTML = '<span style="color:var(--bad)">'+esc(e.message || e)+'</span>'; }
      }, 30);
    };
    fr.readAsArrayBuffer(f);
  }, function(){ meta.innerHTML = '<span style="color:var(--bad)">Gagal memuat pembaca Excel. Periksa koneksi lalu coba lagi.</span>'; });
}
function unitAlerts(f){
  var h = '';
  if (f.noUnit) h += '<div class="alert info">Kolom satuan tidak ditemukan — semua qty dianggap DUS.</div>';
  var unk = Object.keys(f.unknown || {});
  if (unk.length) h += '<div class="alert warn">'+unk.map(function(u){ return fmt(f.unknown[u])+' baris satuan "'+esc(u)+'"'; }).join(', ')+' tidak bisa dikonversi ke dus dan tidak dihitung. Hubungi admin untuk menambah aturan konversi.</div>';
  return h;
}
function unitSummary(f){ var u = Object.keys(f.units || {}); return u.length ? 'Satuan: ' + u.map(function(x){ return esc(x) + ' ' + fmt(f.units[x]); }).join(' · ') : ''; }
var COLS = {
  d: ['tanggal','tgl','tanggal faktur','tgl faktur','tanggal nota','tgl nota','date','tanggal transaksi'],
  k: ['kode pelanggan','kode outlet','kode customer','kode toko','kd pelanggan','kode cust','customer code','id pelanggan'],
  s: ['nama salesman','salesman','nama sales','sales','kode salesman'],
  b: ['nama barang','nama produk','produk','nama item','item','deskripsi barang','barang'],
  kb: ['kode','kode barang','kode produk','kode item','sku'],
  q: ['qty','kuantitas','quantity','jumlah qty','jml qty'],
  u: ['sat','satuan','unit','uom','satuan jual','sat jual','satuan qty'],
  v: ['netto','total netto','d p p','dpp','jumlah rp','nilai','subtotal','total']
};
function normH(h){ return String(h==null?'':h).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function mapHeader(row){
  var H = row.map(normH), m = {};
  Object.keys(COLS).forEach(function(key){ var al = COLS[key].map(normH), idx = -1; for (var a = 0; a < al.length && idx < 0; a++) idx = H.indexOf(al[a]); m[key] = idx; });
  return m;
}
function cellDate(v){
  if (typeof v === 'number' && v > 20000 && v < 80000) { var d = new Date(Math.round((v - 25569) * 864e5)); return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate()); }
  return toISO(v);
}
function parseWorkbook(wb){
  var tx = [], dataMin = '', dataMax = '', rowsRead = 0, found = false, noSales = false, units = {}, unknown = {}, noUnit = false;
  wb.SheetNames.forEach(function(name){
    var aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:''});
    for (var h = 0; h < Math.min(aoa.length, 15); h++) {
      var m = mapHeader(aoa[h]);
      if (m.d < 0 || m.k < 0 || m.b < 0 || m.q < 0) continue;
      found = true; if (m.s < 0) noSales = true; if (m.u < 0) noUnit = true;
      for (var i = h + 1; i < aoa.length; i++) {
        var r = aoa[i], d = cellDate(r[m.d]), k = normKode(r[m.k]), q = Number(String(r[m.q]).replace(',', '.'));
        if (!d || !k || isNaN(q)) continue;
        rowsRead++;
        if (!dataMin || d < dataMin) dataMin = d;
        if (!dataMax || d > dataMax) dataMax = d;
        var b = String(r[m.b]).trim(), kb = m.kb >= 0 ? String(r[m.kb]).trim() : '';
        if (isSku2000(b, kb, S)) {
          var u = m.u >= 0 ? String(r[m.u]).trim().toUpperCase() : '', dq = toDus(q, u, b, kb, S);
          units[u || 'DUS'] = (units[u || 'DUS'] || 0) + 1;
          if (dq === null) { unknown[u] = (unknown[u] || 0) + 1; continue; }
          tx.push({d:d, k:k, s:String(m.s >= 0 ? r[m.s] : '').trim(), q:dq, qr:q, u:u, v:m.v >= 0 ? (Number(r[m.v]) || 0) : 0, b:b, kb:kb});
        }
      }
      break;
    }
  });
  if (!found) throw new Error('Kolom wajib tidak ditemukan. Baris judul harus berisi: Tanggal, Kode Pelanggan, Nama Barang, Qty, Nama Salesman.');
  if (noSales) throw new Error('Kolom Nama Salesman tidak ditemukan.');
  if (!rowsRead) throw new Error('Tidak ada baris transaksi yang terbaca.');
  return {tx:tx, dataMin:dataMin, dataMax:dataMax, rowsRead:rowsRead, units:units, unknown:unknown, noUnit:noUnit};
}

/* ---------- peringkat & pemenang ---------- */
function recompute(){
  var e = entry(), ready = e && head.periode && e.members.every(function(d){ return FILES[d]; });
  if (!ready) {
    C = null; AO = [];
    $('rank').innerHTML = '<p class="sub" style="margin:0">Peringkat muncul setelah semua data transaksi di-upload dan periode dipilih.</p>';
    $('win').innerHTML = '<p class="sub" style="margin:0">—</p>';
    $('bar-tot').textContent = '';
    return;
  }
  AO = computeAo(e.members.map(function(d){ return {dist:d, tx:FILES[d].tx}; }), head.periode, S);
  renderRank();
}
function rowsInput(){
  return AO.map(function(a){ var x = extra[keyOf(a.dist, a.name)] || {}; return {dist:a.dist, name:a.name, ao:a.ao, value:a.value, target:x.target || 0, pay:x.pay || {m:'own', bank:'', cab:'', an:''}}; });
}
function renderRank(){
  C = computeKomp({rows: rowsInput()}, S);
  var multi = entry().members.length > 1;
  if (!C.rows.length) { $('rank').innerHTML = '<div class="alert warn">Tidak ada transaksi SKU 2000 non Money Mouse di periode '+periodeLabel(head.periode)+'.</div>'; $('win').innerHTML=''; $('bar-tot').textContent=''; return; }
  $('rank').innerHTML = '<p class="sub" style="margin:0 0 10px">Isi <b>target AO SKU 2000</b> tiap salesman sesuai target yang ditetapkan. Target kosong = tidak ikut kompetisi. Target akan dicek admin.</p>' +
    '<div class="tw"><table class="rk"><thead><tr><th class="c">Rank</th><th class="l">Salesman</th>'+(multi?'<th class="l">Distributor</th>':'')+'<th>AO SKU 2000</th><th>Nilai SKU 2000</th><th>Target AO</th><th>Pencapaian</th><th class="l">Status</th></tr></thead><tbody>' +
    C.order.map(function(r){
      var x = extra[keyOf(r.dist, r.name)] || {};

        '<td class="num">'+fmt(r.ao)+'</td><td class="num">'+fmt(r.value)+'</td><td><input class="num" data-target value="'+(x.target?fmt(x.target):'')+'" inputmode="numeric" placeholder="target"></td>' +
        '<td class="num" data-ach>'+(r.target?pct(r.ach):'-')+'</td><td class="l" data-st>'+status(r)+'</td></tr>';
    }).join('') + '</tbody></table></div>';
  $('rank').querySelectorAll('[data-target]').forEach(function(inp){
    inp.addEventListener('input', function(){ var k = inp.closest('tr').dataset.key; extra[k] = extra[k] || {}; extra[k].target = parseNum(inp.value); refresh(); save(); });
    inp.addEventListener('blur', function(){ var n = parseNum(inp.value); inp.value = n ? fmt(n) : ''; });
  });
  renderWin();
}
function status(r){
  if (r.winner) return '<span class="badge ok">🏆 Pemenang</span>' + (r.tieNote ? ' <span style="font-size:12px;color:var(--warn)">'+esc(r.tieNote)+'</span>' : '');
  if (r.eligible) return '<span class="badge na">Memenuhi target</span>';
  return '<span style="color:var(--muted);font-size:12.5px">'+esc(r.why)+'</span>';
}
function refresh(){
  C = computeKomp({rows: rowsInput()}, S);
  document.querySelectorAll('#rank tr[data-key]').forEach(function(tr){
    var r = C.rows.filter(function(x){ return keyOf(x.dist, x.name) === tr.dataset.key; })[0];
    tr.classList.toggle('win', r.winner);
    tr.querySelector('[data-ach]').textContent = r.target ? pct(r.ach) : '-';
    tr.querySelector('[data-st]').innerHTML = status(r);
  });
  renderWin();
}

      '<label class="f">Bank / No. Rekening<input data-pay="bank" value="'+esc(pay.bank)+'" placeholder="mis. BCA 1234567890"></label>' +

      '<label class="f">Atas nama<input data-pay="an" value="'+esc(pay.an)+'" placeholder="Nama pemilik rekening"></label>' +

  el.querySelectorAll('[data-pay]').forEach(function(inp){

/* ---------- submit ---------- */
function confirmSubmit(){
  var bad = [];
  ['entry','periode','pengaju'].concat(S.needCode?['code']:[]).concat(head.entry==='__lain__'?['distLain']:[]).forEach(function(k){
    if (!String(head[k]||'').trim()) { bad.push(k); var el = document.querySelector('[data-h="'+k+'"]'); if (el) el.classList.add('err'); }
  });
  if (bad.length) return msgModal('Data belum lengkap', 'Lengkapi kolom bertanda merah.');
  var e = entry();
  var miss = e.members.filter(function(d){ return !FILES[d]; });
  if (miss.length) return msgModal('Data transaksi belum lengkap', 'Upload data transaksi: ' + miss.join(', ') + '.');
  var cov = e.members.filter(function(d){ var f = FILES[d]; return f.dataMin > head.periode + '-07' || f.dataMax < head.periode + '-24'; });
  if (cov.length) return msgModal('Data belum mencakup periode', 'File ' + cov.join(', ') + ' belum mencakup seluruh ' + periodeLabel(head.periode) + '.');
  if (!C || !C.rows.length) return msgModal('Tidak ada data', 'Tidak ada transaksi SKU 2000 di periode ini.');
  if (!C.rows.some(function(r){ return r.target > 0; })) return msgModal('Target belum diisi', 'Isi target AO SKU 2000 minimal untuk salesman yang ikut kompetisi.');
  var w = C.winner;
  $('modal-box').innerHTML = '<h3>Kirim klaim Kompetisi AO 2000?</h3><p class="sub" style="margin:0">'+esc(e.label)+' · '+periodeLabel(head.periode)+'</p>' +
    '<table><tr><td>Salesman dihitung</td><td class="num">'+C.rows.length+'</td></tr><tr><td>Memenuhi target</td><td class="num">'+C.eligibleCount+'</td></tr>' +
    '<tr><td>Pemenang</td><td>'+(w ? esc(w.name)+' (AO '+fmt(w.ao)+')' : '—')+'</td></tr><tr><td>Insentif diterima</td><td class="num">'+rp(C.totalNet)+'</td></tr></table>' +
    '<p class="sub" style="font-size:13px">File transaksi ikut dikirim sebagai bukti. Perhitungan final dicek ulang oleh sistem dan admin.</p>' +
    '<div id="m-err"></div><div class="row"><button class="b" id="m-cancel">Periksa lagi</button><button class="b primary" id="m-ok">Ya, kirim klaim</button></div>';
  $('modal').classList.add('show');
  $('m-cancel').onclick = closeModal; $('m-ok').onclick = doSubmit;
}
function call(fn){ var args = [].slice.call(arguments, 1); return new Promise(function(res, rej){ GS.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null, args); }); }
function doSubmit(){
  var btn = $('m-ok'), cancel = $('m-cancel'), e = entry();
  btn.disabled = true; cancel.disabled = true;
  var fail = function(err){ btn.disabled = false; cancel.disabled = false; btn.textContent = 'Coba kirim lagi'; $('m-err').innerHTML = '<div class="alert bad">'+esc(err && err.message || err)+'</div>'; };
  var members = e.members.map(function(d){ var f = FILES[d]; return {dist:d, fileName:f.fileName, dataMin:f.dataMin, dataMax:f.dataMax, rowsRead:f.rowsRead,
    tx:f.tx.filter(function(t){ return t.d.slice(0,7) === head.periode; })}; });
  var rows = rowsInput().map(function(r){ return {dist:r.dist, name:r.name, target:r.target, pay:r.pay}; });
  var payload = {entry:head.entry, distLain:head.distLain, periode:head.periode, pengaju:head.pengaju, kontak:head.kontak, code:head.code, members:members, rows:rows};
  if (PREVIEW) { btn.textContent = 'Mengirim…'; setTimeout(function(){ closeModal(); showDone({id:'AO-PRATINJAU', winner:C.winner, eligible:C.eligibleCount, totalNet:C.totalNet}); }, 600); return; }
  var i = 0;
  (function next(){
    if (i < members.length) {
      btn.textContent = 'Upload file ' + (i + 1) + '/' + members.length + '…';
      return call('uploadSource', FILES[members[i].dist].fileName, FILES[members[i].dist].b64)
        .then(function(id){ members[i].fileId = id; i++; next(); })
        .catch(function(){ members[i].fileId = ''; i++; next(); });   // file bukti gagal tersimpan tidak membatalkan klaim
    }
    btn.textContent = 'Mengirim klaim…';
    call('submitKlaim', payload).then(function(res){ closeModal(); showDone(res); }).catch(fail);
  })();
}
function showDone(res){
  var lbl = entry().label, per = periodeLabel(head.periode);
  FILES = {}; extra = {}; for (var k in head) if (k !== 'code') head[k] = ''; save();
  $('app').innerHTML = '<div class="panel center"><div style="font-size:44px">✓</div><h1>Klaim berhasil dikirim</h1>' +
    '<p class="sub">Simpan nomor klaim berikut untuk konfirmasi ke admin.</p><div class="done-id">'+esc(res.id)+'</div><p>'+esc(lbl)+' · '+esc(per)+'</p>' +
    '<table class="sum" style="max-width:440px;margin:16px auto"><tr><td class="l">Pemenang</td><td>'+(res.winner ? esc(res.winner.name)+' · AO '+fmt(res.winner.ao) : '—')+'</td></tr>' +
    '<tr><td class="l"><b>Estimasi diterima</b></td><td class="num"><b>'+rp(res.totalNet)+'</b></td></tr></table>' +
    '<p class="sub" style="font-size:13px">Nilai final mengikuti hasil verifikasi admin.</p><button class="b primary" id="again">Ajukan klaim lain</button></div>';
  $('again').onclick = function(){ renderShell(); };
  window.scrollTo(0,0);
}
function msgModal(t, m){ $('modal-box').innerHTML = '<h3>'+esc(t)+'</h3><p>'+esc(m)+'</p><div class="row"><button class="b primary" id="m-cancel">OK</button></div>'; $('modal').classList.add('show'); $('m-cancel').onclick = closeModal; }
function closeModal(){ $('modal').classList.remove('show'); }

/* ---------- draft lokal (tanpa file) ---------- */
function save(){ setTimeout(refreshSubmit, 0); try { localStorage.setItem(STORE, JSON.stringify({head:head, extra:extra})); } catch(e){} }
function load(){ try { var s = JSON.parse(localStorage.getItem(STORE)||'null'); if (s) { if (s.head) for (var k in head) head[k] = s.head[k] || ''; if (s.extra) extra = s.extra; } } catch(e){} }


/* ---------- tombol submit terkunci (abu-abu) sampai data wajib lengkap ---------- */
function refreshSubmit(){
  var btn = document.getElementById('submit');
  if (!btn || !S) return;
  var miss = [];
  try { miss = missing(); } catch (e) { miss = []; }
  window.__missing = miss;
  var locked = miss.length > 0;
  btn.classList.toggle('is-locked', locked);
  btn.setAttribute('aria-disabled', locked ? 'true' : 'false');
  btn.title = locked ? 'Lengkapi: ' + miss.join('; ') : '';
  if (!btn.__gated) {
    btn.__gated = true;
    // tombol terkunci tidak mengirim; klik menampilkan daftar yang belum lengkap
    btn.addEventListener('click', function (ev) {
      if (btn.getAttribute('aria-disabled') === 'true') { ev.preventDefault(); ev.stopImmediatePropagation(); showMissing(); }
    }, true);
  }
  var st = document.getElementById('submit-hint');
  if (!st) {
    st = document.createElement('button');
    st.type = 'button'; st.id = 'submit-hint';
    btn.parentNode.insertBefore(st, btn);
    st.addEventListener('click', function () { if ((window.__missing || []).length) showMissing(); });
  }
  st.className = 'submit-status ' + (locked ? 'is-todo' : 'is-ready');
  st.disabled = !locked;
  st.innerHTML = locked
    ? '<span class="dot" aria-hidden="true"></span>' + miss.length + ' bagian belum lengkap · <u>lihat</u>'
    : '<span class="dot" aria-hidden="true"></span>Data lengkap, siap dikirim';
}
function showMissing(){
  markMissing();
  var miss = window.__missing || [];
  $('modal-box').innerHTML = '<h3>Data belum lengkap</h3><p class="sub" style="margin:0 0 6px">Lengkapi dulu bagian berikut sebelum klaim bisa dikirim:</p>' +
    '<ul class="miss-list">' + miss.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' +
    '<div class="row"><button class="b primary" id="m-cancel">Lengkapi sekarang</button></div>';
  $('modal').classList.add('show');
  $('m-cancel').onclick = function () {
    closeModal();
    var f = document.querySelector('.err');
    if (f) { f.scrollIntoView({behavior: 'smooth', block: 'center'}); try { f.focus({preventScroll: true}); } catch (e) {} }
  };
}
/** tandai merah kolom wajib yang masih kosong / 0 */
function markMissing(){
  var zero = function (v) { var s = String(v == null ? '' : v).replace(/\./g, '').replace(',', '.').trim(); return !s || parseFloat(s) === 0; };
  document.querySelectorAll('label.f').forEach(function (l) {
    var c = l.querySelector('input:not([readonly]):not([disabled]), select');
    if (l.querySelector('.req') && c && blankStr(c.value)) c.classList.add('err');
  });
  document.querySelectorAll('.sm-name input:not([readonly])').forEach(function (x) { if (blankStr(x.value)) x.classList.add('err'); });
  document.querySelectorAll('table.kpi tr, table.mk tr').forEach(function (tr) {
    var t = tr.querySelector('input[data-p="t"]');
    if (tr.getAttribute('data-k') === 'pf' && t && !t.disabled && zero(t.value) && !(typeof scheme === 'function' && scheme() === 'A')) return;
    tr.querySelectorAll('input.num:not([readonly]):not([disabled])').forEach(function (x) {
      if (x.dataset.p === 's' || x.dataset.p === 'n') {
        var sib = tr.querySelectorAll('input.num:not([readonly]):not([disabled])[data-p="s"], input.num:not([readonly]):not([disabled])[data-p="n"]');
        var any = Array.prototype.some.call(sib, function (y) { return !zero(y.value); });
        if (!any) x.classList.add('err');
      } else if (zero(x.value)) x.classList.add('err');
    });
  });
}
function blankStr(x){ return !String(x == null ? '' : x).trim(); }

function missing(){
  var m = [], e = entry();
  if (!head.entry) m.push('distributor / group');
  else if (head.entry === '__lain__' && blankStr(head.distLain)) m.push('nama distributor');
  if (blankStr(head.periode)) m.push('periode');
  if (blankStr(head.pengaju)) m.push('nama pengaju');
  if (S.needCode && blankStr(head.code)) m.push('kode akses');
  if (e) {
    var miss = e.members.filter(function(d){ return !FILES[d]; });
    if (miss.length) m.push('file transaksi ' + miss.join(', '));
    else if (head.periode) {
      var cov = e.members.filter(function(d){ var f = FILES[d]; return f.dataMin > head.periode + '-07' || f.dataMax < head.periode + '-24'; });
      if (cov.length) m.push('data periode lengkap (' + cov.join(', ') + ')');
      if (!C || !C.rows.length) m.push('transaksi SKU 2000 di periode');
      else if (!C.rows.some(function(r){ return r.target > 0; })) m.push('target AO SKU 2000 salesman');
    }
  }
  return m;
}

start();
</script>
