<style>

  *{box-sizing:border-box}

  button.b{font:inherit;font-weight:700;border-radius:10px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13px}

  .submit-bar{position:sticky;bottom:0;background:rgba(244,245,242,.95);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 0;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
  .stat{background:#f6f7f4;border-radius:10px;padding:10px 12px} .stat b{display:block;font-size:18px}
  .stat span{font-size:12px;color:var(--muted)}
  details.ex{margin-top:10px;font-size:13px} details.ex summary{cursor:pointer;font-weight:700;color:var(--muted)}
  details.ex table{width:100%;border-collapse:collapse;margin-top:6px} details.ex td{padding:4px 6px;border-top:1px solid #f0f2ee}
  table.ol td.ro{font-size:13px;padding:7px 6px}

  @media (max-width:900px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.rules{grid-template-columns:1fr}.paybox{grid-template-columns:1fr 1fr}}

<div class="wrap"><div id="app"><div class="loading">Memuat form…</div></div></div>
<div class="modal" id="modal"><div class="box" id="modal-box"></div></div>

<script>
/* ===== LOGIKA NOO OPAK (dipakai sama persis di server & form) ===== */
var METHODS = {own:'Rekening sendiri', titip:'Titip 1 rekening', co:'Rekening perusahaan'};
var JENIS = {M:'NOO Murni', R:'Outlet Existing'};
var BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];

function periodeLabel(p) { var m = /^(\d{4})-(\d{2})$/.exec(p || ''); return m ? BULAN[+m[2] - 1] + ' ' + m[1] : String(p || ''); }
function pad2(n) { return (n < 10 ? '0' : '') + n; }
/** tanggal batas: pembelian terakhir harus SEBELUM tanggal ini (awal periode dikurangi N bulan) */
/** periode tanpa syarat N bulan (mis. bulan pertama program): pembelian sebelumnya tidak membatalkan NOO */
function isWaived(periode, S) { return String((S && S.noLookback) || '').split(',').map(function (x) { return x.trim(); }).indexOf(periode) >= 0; }
/** batas lookback efektif: '' bila periode dibebaskan */
function lookbackCut(periode, S) { return isWaived(periode, S) ? '' : cutoffDate(periode, Number(S.lookback) || 3); }
/** tanggal awal data yang dibutuhkan untuk periode ini */
function dataStartNeeded(periode, S) { return lookbackCut(periode, S) || periode + '-07'; }
function cutoffDate(periode, months) {
  var m = /^(\d{4})-(\d{2})$/.exec(periode || ''); if (!m) return '';
  var y = +m[1], mo = +m[2] - Number(months || 3);
  while (mo < 1) { mo += 12; y--; }
  return y + '-' + pad2(mo) + '-01';
}
/** normalisasi tanggal ke YYYY-MM-DD; terima 13/11/2026, 13-11-2026, 2026-11-13, Date */
function toISO(v) {
  if (v == null || v === '') return '';
  if (Object.prototype.toString.call(v) === '[object Date]') return isNaN(v) ? '' : v.getFullYear() + '-' + pad2(v.getMonth() + 1) + '-' + pad2(v.getDate());
  var s = String(v).trim(), m;
  if ((m = /^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/.exec(s))) return m[1] + '-' + pad2(+m[2]) + '-' + pad2(+m[3]);
  if ((m = /^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/.exec(s))) { var y = +m[3]; if (y < 100) y += 2000; return y + '-' + pad2(+m[2]) + '-' + pad2(+m[1]); }
  return '';
}
function fmtDate(iso) { var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
function normJenis(v) { var s = String(v || '').trim().toUpperCase(); if (!s) return ''; if (s[0] === 'R' || s.indexOf('EXIST') >= 0 || s.indexOf('REAK') >= 0) return 'R'; if (s[0] === 'M' || s.indexOf('NOO') >= 0 || s.indexOf('BARU') >= 0) return 'M'; return ''; }
function normKode(v) { return String(v || '').trim().toUpperCase().replace(/\s+/g, ''); }

/**
 * Evaluasi seluruh outlet & hitung insentif.
 * input: {periode:'YYYY-MM', rows:[{name, pay:{m,bank,cab,an}, outlets:[{kode,nama,alamat,tgl,jenis,last,admin,prior}]}]}
 *   outlet.admin : 'YA' | 'TIDAK' | ''  (keputusan admin, mengalahkan cek sistem)
 *   outlet.prior : teks bila outlet sudah diklaim di klaim sebelumnya (diisi server)
 * S: {perOutlet, minOutlet, lookback, ownThr, titipThr, titipRate, coRate}
 */
function computeNoo(input, S) {
  var per = Number(S.perOutlet) || 0, min = Number(S.minOutlet) || 0, lb = Number(S.lookback) || 3;
  var cut = lookbackCut(input.periode, S), waived = !cut, seen = {};
  var rows = input.rows.map(function (r) {
    var o = {name: r.name, pay: r.pay || {m: 'own'}, outlets: [], submitted: 0, valid: 0, murni: 0, reakt: 0};
    (r.outlets || []).forEach(function (x) {
      var kode = normKode(x.kode), tgl = toISO(x.tgl), last = toISO(x.last), jenis = normJenis(x.jenis), why = [];
      if (!kode) why.push('Kode outlet kosong');
      if (!String(x.nama || '').trim()) why.push('Nama outlet kosong');
      if (!tgl) why.push('Tgl transaksi NOO kosong/tidak valid');
      else if (tgl.slice(0, 7) !== input.periode) why.push('Tgl transaksi di luar periode klaim');
      if (!jenis) why.push('Jenis NOO tidak valid');
      if (jenis === 'R' && !last && x.src !== 'auto' && !waived) why.push('Outlet existing wajib isi tgl pembelian BMX Opak terakhir');
      if (last && cut && last >= cut) why.push('Pembelian BMX Opak terakhir ' + fmtDate(last) + ' masih dalam ' + lb + ' bulan terakhir');
      if (last && tgl && last >= tgl) why.push('Tgl pembelian terakhir tidak boleh setelah tgl NOO');
      if (kode && seen[kode]) why.push('Duplikat dengan ' + seen[kode]);
      if (x.prior) why.push(x.prior);
      if (kode && !seen[kode]) seen[kode] = 'salesman ' + r.name;
      var sys = why.length === 0, adm = String(x.admin || '').toUpperCase();
      var ok = adm === 'YA' ? true : adm === 'TIDAK' ? false : sys;
      var e = {kode: kode, nama: String(x.nama || '').trim(), alamat: String(x.alamat || '').trim(), tgl: tgl, jenis: jenis, last: last,
        admin: adm === 'YA' || adm === 'TIDAK' ? adm : '', note: x.note || '', prior: x.prior || '', src: x.src === 'auto' ? 'auto' : 'manual', sys: sys, reason: why.join('; '), ok: ok};
      o.outlets.push(e);
      o.submitted++;
      if (ok) { o.valid++; if (jenis === 'R') o.reakt++; else o.murni++; }
    });
    o.eligible = o.valid >= min;
    o.incentive = o.eligible ? o.valid * per : 0;
    return o;
  });
  var list = rows.map(function (r, i) {
    var p = r.pay || {};
    return {i: i, name: r.name, m: METHODS[p.m] ? p.m : 'own', bank: p.bank || '', cab: p.cab || '', an: p.an || '', nom: r.incentive};
  }).filter(function (x) { return x.nom > 0; });
  var titipSum = list.filter(function (x) { return x.m === 'titip'; }).reduce(function (a, x) { return a + x.nom; }, 0);
  var titipOn = titipSum > 0 && titipSum >= Number(S.titipThr);
  var agg = {nom: 0, tax: 0, net: 0};
  list.forEach(function (x) {
    x.rate = x.m === 'co' ? Number(S.coRate) : x.m === 'titip' ? (titipOn ? Number(S.titipRate) : 0) : 0;
    x.tax = Math.round(x.nom * x.rate / 100);
    x.net = x.nom - x.tax;
    x.flag = x.m === 'own' && x.nom >= Number(S.ownThr);
    agg.nom += x.nom; agg.tax += x.tax; agg.net += x.net;
  });
  var t = rows.reduce(function (a, r) { a.sub += r.submitted; a.val += r.valid; a.elig += r.eligible ? 1 : 0; return a; }, {sub: 0, val: 0, elig: 0});
  return {rows: rows, cutoff: cut, pay: {list: list, titipSum: titipSum, titipOn: titipOn, nom: agg.nom, tax: agg.tax, net: agg.net},
    submitted: t.sub, valid: t.val, eligible: t.elig, total: agg.nom, totalNet: agg.net};
}


/* ===== KONVERSI SATUAN → DUS/KARTON ===== */
/** jenis satuan: 'dus' | 'pcs' | 'rcg' | '' (tidak dikenal). Kosong dianggap dus. */
function unitKind(u) {
  var s = String(u == null ? '' : u).trim().toUpperCase().replace(/[^A-Z]/g, '');
  if (!s) return 'dus';
  if (/^(DUS|DOS|DS|KRT|KARTON|CARTON|CTN|CT|KTN|BOX|BX)$/.test(s)) return 'dus';
  if (/^(PCS|PC|PCE|PIECE|BKS|BUNGKUS|SACHET|SCH|BIJI|BJ|EA)$/.test(s)) return 'pcs';
  if (/^(RCG|RENCENG|RENTENG|RC|RTG|RNC|STRIP|STR|PAK|PACK|PK)$/.test(s)) return 'rcg';
  return '';
}
/** isi per dus dari pengaturan khusus ("KATA=pcs:renceng; ...") atau dari nama barang (mis. 4X10 = 4 renceng × 10 pcs) */
function packOf(namaBarang, kodeBarang, S) {
  var n = String(namaBarang || '').toUpperCase(), k = String(kodeBarang || '').toUpperCase().trim();
  var rules = String((S && S.packRules) || '').split(';');
  for (var i = 0; i < rules.length; i++) {
    var m = /^\s*([^=]+?)\s*=\s*(\d+)\s*(?::\s*(\d+))?\s*$/.exec(rules[i]);
    if (m && (n.indexOf(m[1].toUpperCase()) >= 0 || k === m[1].toUpperCase())) return {pcs: +m[2], rcg: m[3] ? +m[3] : 0};
  }
  var x = /(\d+)\s*[X×]\s*(\d+)/.exec(n);
  if (x) return {pcs: +x[1] * +x[2], rcg: +x[1]};
  var p = /(\d+)\s*PCS/.exec(n);
  if (p) return {pcs: +p[1], rcg: 0};
  return {pcs: 0, rcg: 0};
}
/** qty dalam dus; null bila satuan / isi per dus tidak diketahui */
function toDus(qty, unit, namaBarang, kodeBarang, S) {
  var q = Number(qty) || 0, kind = unitKind(unit);
  if (kind === 'dus') return q;
  if (!kind) return null;
  var pk = packOf(namaBarang, kodeBarang, S), f = kind === 'pcs' ? pk.pcs : pk.rcg;
  return f > 0 ? q / f : null;
}
function fmtDus(x) { x = Math.round(Number(x || 0) * 100) / 100; return String(x).replace('.', ','); }

/* ===== DETEKSI NOO OTOMATIS DARI DATA TRANSAKSI ===== */
function isOpak(namaBarang, kodeBarang, keywords) {
  var n = String(namaBarang || '').toUpperCase(), k = String(kodeBarang || '').toUpperCase().trim();
  return String(keywords || 'OPAK').split(',').map(function (w) { return w.trim().toUpperCase(); }).filter(String)
    .some(function (w) { return n.indexOf(w) >= 0 || k === w; });
}
/**
 * data: {tx:[{d:'YYYY-MM-DD', k:kodeOutlet, n:namaOutlet, s:salesman, q:qty, no:nota}] (hanya transaksi BMX Opak),
 *        first:{kodeOutlet: tgl transaksi pertama produk apa pun}}
 * NOO = outlet yang membeli BMX Opak (qty bersih > 0) di periode dan TIDAK membeli BMX Opak dalam N bulan sebelumnya.
 *   NOO Murni      : transaksi pertama outlet (produk apa pun) terjadi di periode klaim
 *   Outlet Existing: sudah pernah bertransaksi sebelumnya
 * Salesman = salesman pada transaksi BMX Opak pertama di periode.
 */
function detectNoo(data, periode, S) {
  var lb = Number(S.lookback) || 3, cut = lookbackCut(periode, S), start = periode + '-01', by = {}, excluded = [];
  (data.tx || []).forEach(function (t) {
    var k = normKode(t.k); if (!k || !t.d) return;
    (by[k] = by[k] || {k: k, list: []}).list.push(t);
  });
  var sales = {};
  Object.keys(by).forEach(function (k) {
    var L = by[k].list, inP = L.filter(function (t) { return t.d.slice(0, 7) === periode; });
    if (!inP.length) return;
    var net = inP.reduce(function (a, t) { return a + (Number(t.q) || 0); }, 0), minD = Number(S.minDus) || 1;
    var pos = inP.filter(function (t) { return Number(t.q) > 0; }).sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
    var nama = (pos[0] || inP[0]).n || '', sm = String((pos[0] || inP[0]).s || '').trim() || '(tanpa salesman)';
    if (net <= 0 || !pos.length) { excluded.push({kode: k, nama: nama, salesman: sm, reason: 'Qty bersih di periode ≤ 0 (retur)'}); return; }
    if (net < minD - 1e-9) { excluded.push({kode: k, nama: nama, salesman: sm, reason: 'Pembelian ' + fmtDus(net) + ' dus (< ' + fmtDus(minD) + ' karton)'}); return; }
    var prior = L.filter(function (t) { return t.d < start && Number(t.q) > 0; }).map(function (t) { return t.d; }).sort();
    var last = prior.length ? prior[prior.length - 1] : '';
    if (last && cut && last >= cut) { excluded.push({kode: k, nama: nama, salesman: sm, reason: 'Beli BMX Opak ' + fmtDate(last) + ' (dalam ' + lb + ' bulan terakhir)'}); return; }
    var f = (data.first || {})[k] || pos[0].d;
    (sales[sm] = sales[sm] || []).push({kode: k, nama: nama, alamat: 'Nota ' + String(pos[0].no || '-').trim() + ' · ' + fmtDus(net) + ' dus',
      tgl: pos[0].d, jenis: f >= start ? 'M' : 'R', last: last, src: 'auto'});
  });
  var rows = Object.keys(sales).sort().map(function (name) {
    return {name: name, outlets: sales[name].sort(function (a, b) { return a.tgl < b.tgl ? -1 : a.tgl > b.tgl ? 1 : 0; })};
  });
  return {rows: rows, excluded: excluded, cutoff: cut};
}

function normH(h){ return String(h==null?'':h).toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function mapHeader(row){

  Object.keys(COLS).forEach(function(key){
    var al = COLS[key].map(normH), idx = -1;

function parseWorkbook(wb){
  var tx = [], first = {}, dataMin = '', dataMax = '', rowsRead = 0, months = {}, found = false, kw = S.keywords || 'OPAK', units = {}, unknown = {}, noUnit = false;

    for (var h = 0; h < Math.min(aoa.length, 15); h++) {
      var m = mapHeader(aoa[h]);
      if (m.d < 0 || m.k < 0 || m.b < 0 || m.q < 0) continue;
      found = true; if (m.u < 0) noUnit = true;
      for (var i = h + 1; i < aoa.length; i++) {
        var r = aoa[i], d = cellDate(r[m.d]), k = normKode(r[m.k]), q = Number(String(r[m.q]).replace(',', '.'));
        if (!d || !k || isNaN(q)) continue;

        months[d.slice(0,7)] = 1;

          tx.push({d:d, k:k, n:String(m.n >= 0 ? r[m.n] : '').trim(), s:String(m.s >= 0 ? r[m.s] : '').trim(), q:dq, qr:q, u:u, b:b, kb:kb, no:String(m.no >= 0 ? r[m.no] : '').trim()});

  if (!found) throw new Error('Kolom wajib tidak ditemukan. Pastikan baris judul berisi: Tanggal, Kode Pelanggan, Nama Barang, Qty (dan Nama Salesman).');
  if (!rowsRead) throw new Error('Tidak ada baris transaksi yang terbaca.');

  var firstOpak = {}; Object.keys(opakKeys).forEach(function(k){ firstOpak[k] = first[k]; });

        '<label class="f">Cabang<input data-pay="cab" value="'+esc(r.pay.cab)+'" placeholder="Cabang bank"></label>' +
        '<label class="f">Atas nama<input data-pay="an" value="'+esc(r.pay.an)+'" placeholder="Nama pemilik rekening"></label>' +
      '</div>' +
      '<div class="sm-foot"><div data-msg style="font-size:13px;font-weight:600"></div><div class="payout"><small>Insentif</small><span class="v num" data-inc></span></div></div>' +
    '</div>';
  }).join('');
  update();
}

function compute(){
  var input = {periode: head.periode, rows: rows.map(function(r){ return {name:r.name, pay:r.pay, outlets:r.outlets.filter(filled)}; })};
  return computeNoo(input, S);
}

function update(){
  var C = compute();
  var cutEl = $('cut'); if (cutEl) cutEl.textContent = !head.periode ? '(pilih periode)' : C.cutoff ? fmtDate(C.cutoff) : 'tidak berlaku untuk ' + periodeLabel(head.periode) + ' (bulan awal program)';
  document.querySelectorAll('.sm').forEach(function(el){
    var i = +el.dataset.i, r = rows[i], c = C.rows[i], k = 0;
    el.querySelectorAll('tr[data-j]').forEach(function(tr){
      var o = r.outlets[+tr.dataset.j], st = tr.querySelector('[data-st]');
      if (!filled(o)) { st.innerHTML = '<span class="empty">—</span>'; tr.classList.remove('bad'); return; }
      var e = c.outlets[k++];
      tr.classList.toggle('bad', !e.ok);
      st.innerHTML = e.ok ? '<span class="okk">✓ Valid</span>' : '<span class="no">✕ '+esc(e.reason)+'</span>';
    });
    var need = Math.max(S.minOutlet - c.valid, 0);
    el.querySelector('[data-count]').innerHTML = '<b>'+c.valid+'</b> valid dari '+c.submitted+' outlet';
    var bar = el.querySelector('[data-bar]'); bar.classList.toggle('ok', c.eligible); bar.querySelector('i').style.width = Math.min(c.valid / S.minOutlet * 100, 100) + '%';
    el.querySelector('[data-need]').textContent = c.eligible ? 'Memenuhi minimal ' + S.minOutlet : 'Kurang ' + need + ' outlet valid';
    var bd = el.querySelector('[data-badge]');
    bd.className = 'badge ' + (c.eligible ? 'ok' : c.submitted ? 'bad' : 'na');
    bd.textContent = c.eligible ? 'Lolos minimal' : c.submitted ? 'Belum lolos' : 'Belum ada outlet';
    el.querySelector('[data-inc]').textContent = rp(c.incentive);
    el.querySelector('[data-msg]').textContent = c.eligible ? c.valid + ' × ' + rp(S.perOutlet) : 'Insentif dihitung bila outlet valid ≥ ' + S.minOutlet + '.';
    el.querySelector('[data-msg]').style.color = c.eligible ? 'var(--ok)' : 'var(--muted)';
  });
  var find = function(i){ for (var j=0;j<C.pay.list.length;j++) if (C.pay.list[j].i===i) return C.pay.list[j]; return {nom:0,tax:0,net:0}; };
  $('sum-body').innerHTML = C.rows.map(function(c,i){
    var p = find(i);
    return '<tr><td class="l">'+(i+1)+'</td><td class="l">'+(esc(c.name)||'<span style="color:#aaa">—</span>')+'</td><td class="num">'+c.submitted+'</td><td class="num">'+c.valid+'</td><td class="num">'+c.murni+'</td><td class="num">'+c.reakt+'</td>' +
      '<td class="c">'+(c.eligible?'<span class="badge ok">Ya</span>':'<span class="badge bad">Tidak</span>')+'</td><td class="num">'+fmt(c.incentive)+'</td><td class="num">'+(p.tax?fmt(p.tax):'-')+'</td><td class="num"><b>'+fmt(p.net)+'</b></td></tr>';
  }).join('');
  $('sum-foot').innerHTML = '<tr><td></td><td class="l">Total</td><td class="num">'+C.submitted+'</td><td class="num">'+C.valid+'</td><td></td><td></td><td class="c">'+C.eligible+' lolos</td><td class="num">'+fmt(C.total)+'</td><td class="num">'+fmt(C.pay.tax)+'</td><td class="num">'+rp(C.totalNet)+'</td></tr>';
  var al = '';
  if (C.pay.titipSum>0) al += C.pay.titipOn ? '<div class="alert info">Kumulatif titip rekening '+rp(C.pay.titipSum)+' ≥ '+rp(S.titipThr)+' → dipotong '+rate(S.titipRate)+'% per orang.</div>' : '<div class="alert info">Kumulatif titip rekening '+rp(C.pay.titipSum)+' di bawah '+rp(S.titipThr)+' → tidak dipotong pajak.</div>';
  if (C.pay.list.some(function(x){ return x.flag; })) al += '<div class="alert warn">Ada pembayaran ke rekening sendiri ≥ '+rp(S.ownThr)+' — pajak akan dicek admin.</div>';
  al += '<div class="alert info">Status outlet di form adalah cek awal. Admin akan mencocokkan dengan data transaksi actual, termasuk outlet yang sudah pernah diklaim sebelumnya.</div>';
  $('alerts').innerHTML = al;
  $('bar-tot').innerHTML = C.valid + ' outlet valid · ' + C.eligible + ' salesman lolos · insentif <span class="num">'+rp(C.total)+'</span>';
  save();
  return C;
}

function bindList(){
  var list = $('list');
  list.addEventListener('input', function(e){
    var t = e.target, el = t.closest('.sm'); if (!el) return;
    var r = rows[+el.dataset.i]; t.classList.remove('err');
    if (t.dataset.f === 'name') { r.name = t.value; update(); }
    else if (t.dataset.o) { r.outlets[+t.closest('tr').dataset.j][t.dataset.o] = t.value; update(); }
    else if (t.dataset.pay) { r.pay[t.dataset.pay] = t.value; update(); }
  });
  list.addEventListener('change', function(e){
    var t = e.target, el = t.closest('.sm'); if (!el) return;
    var r = rows[+el.dataset.i];
    if (t.dataset.o) { r.outlets[+t.closest('tr').dataset.j][t.dataset.o] = t.value; update(); }
    if (t.dataset.pay) { r.pay[t.dataset.pay] = t.value; update(); }
  });
  list.addEventListener('click', function(e){
    var t = e.target, el = t.closest('.sm'); if (!el) return;
    var i = +el.dataset.i, r = rows[i];
    if (t.matches('[data-del]')) { rows.splice(i,1); if (!rows.length) rows.push(blank()); renderCards(); }
    else if (t.matches('[data-delo]')) { r.outlets.splice(+t.closest('tr').dataset.j, 1); if (!r.outlets.length) r.outlets.push(blankOutlet()); renderCards(); }
    else if (t.matches('[data-addo]')) { for (var k=0;k<+t.dataset.addo;k++) r.outlets.push(blankOutlet()); renderCards(); }
    else if (t.matches('[data-clean]')) { r.outlets = r.outlets.filter(filled); if (!r.outlets.length) r.outlets.push(blankOutlet()); renderCards(); }
    else if (t.matches('[data-paste]')) openPaste(i);
  });
}

/* ---------- tempel dari Excel ---------- */
function openPaste(i){
  $('modal-box').innerHTML = '<h3>Tempel daftar outlet — '+(esc(rows[i].name)||'salesman '+(i+1))+'</h3>' +
    '<p class="sub" style="margin:0">Salin dari Excel / Google Sheets dengan urutan kolom berikut (baris judul boleh ikut):</p>' +
    '<code class="fmt">Kode Outlet | Nama Outlet | Alamat | Tgl Transaksi NOO | Jenis (Murni/Reaktivasi) | Tgl Beli BMX Opak Terakhir</code>' +
    '<p class="sub" style="font-size:12px;margin:0 0 8px">Format tanggal: 13/11/2026 atau 2026-11-13. Kolom Jenis boleh "M"/"R"; kosong = NOO Murni.</p>' +
    '<textarea id="paste-ta" placeholder="Tempel di sini (Ctrl+V)"></textarea>' +
    '<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px"><input type="checkbox" id="paste-replace" style="width:auto"> Ganti seluruh daftar outlet salesman ini</label>' +
    '<div id="paste-info" class="sub" style="margin:8px 0 0;font-size:13px"></div>' +
    '<div class="row"><button class="b" id="m-cancel">Batal</button><button class="b primary" id="m-ok">Tambahkan</button></div>';
  $('modal').classList.add('show');
  var ta = $('paste-ta'); ta.focus();
  ta.addEventListener('input', function(){ var n = parsePaste(ta.value).length; $('paste-info').textContent = n ? n + ' outlet terbaca.' : ''; });
  $('m-cancel').onclick = closeModal;
  $('m-ok').onclick = function(){
    var list = parsePaste(ta.value);
    if (!list.length) { $('paste-info').textContent = 'Tidak ada baris yang terbaca.'; return; }
    var r = rows[i];
    r.outlets = ($('paste-replace').checked ? [] : r.outlets.filter(filled)).concat(list);
    closeModal(); renderCards();
  };
}
function parsePaste(text){
  return String(text||'').split(/\r?\n/).map(function(line){
    if (!line.trim()) return null;
    var c = line.indexOf('\t') >= 0 ? line.split('\t') : line.split(/;|,(?=\s*\S)/);
    c = c.map(function(x){ return x.trim(); });
    if (/kode/i.test(c[0]) && /nama/i.test(c[1]||'')) return null;
    return {kode:c[0]||'', nama:c[1]||'', alamat:c[2]||'', tgl:toISO(c[3]), jenis:normJenis(c[4])||'M', last:toISO(c[5])};
  }).filter(function(o){ return o && filled(o); });
}

/* ---------- submit ---------- */
function validate(){
  var bad = false;
  ['distributor','periode','pengaju'].concat(S.needCode?['code']:[]).forEach(function(k){
    if (!String(head[k]||'').trim()) { bad = true; var el = document.querySelector('[data-h="'+k+'"]'); if (el) el.classList.add('err'); }
  });
  if (mode === 'manual') rows.forEach(function(r,i){ if (!r.name.trim()) { bad = true; document.querySelector('.sm[data-i="'+i+'"] [data-f="name"]').classList.add('err'); } });
  if (bad) { var first = document.querySelector('.err'); if (first) { first.scrollIntoView({behavior:'smooth', block:'center'}); first.focus(); } }
  return !bad;
}
function confirmSubmit(){
  if (!validate()) { msgModal('Data belum lengkap', 'Kolom bertanda merah wajib diisi: distributor, periode, nama pengaju'+(S.needCode?', kode akses':'')+' dan nama salesman.'); return; }
  var C = compute();
  if (mode === 'auto') {
    if (!AUTO) { msgModal('Belum ada data', 'Upload file data transaksi terlebih dahulu.'); return; }
    var cut = dataStartNeeded(head.periode, S);
    if (AUTO.dataMin > cut || AUTO.dataMax < head.periode + '-01') { msgModal('Data transaksi belum cukup', 'Untuk periode '+periodeLabel(head.periode)+' file harus berisi transaksi mulai '+fmtDate(cut)+' sampai bulan '+periodeLabel(head.periode)+'.'); return; }
  }
  if (!C.submitted) { msgModal('Belum ada outlet', mode === 'auto' ? 'Tidak ada outlet NOO terdeteksi di periode ini.' : 'Isi minimal satu outlet NOO.'); return; }
  $('modal-box').innerHTML = '<h3>Kirim klaim NOO Opak?</h3><p class="sub" style="margin:0">'+esc(head.distributor)+' · '+periodeLabel(head.periode)+' · '+rows.length+' salesman</p>' +
    '<table><tr><td>Outlet diajukan / valid (cek awal)</td><td class="num">'+C.submitted+' / '+C.valid+'</td></tr>' +
    '<tr><td>Salesman memenuhi minimal '+S.minOutlet+' outlet</td><td class="num">'+C.eligible+' dari '+rows.length+'</td></tr>' +
    '<tr><td>Insentif / diterima</td><td class="num">'+fmt(C.total)+' / '+fmt(C.totalNet)+'</td></tr></table>' +
    '<p class="sub" style="font-size:13px">Outlet yang belum valid tetap ikut terkirim untuk diperiksa admin. Setelah dikirim, klaim tidak bisa diubah dari form ini.</p>' +
    '<div id="m-err"></div><div class="row"><button class="b" id="m-cancel">Periksa lagi</button><button class="b primary" id="m-ok">Ya, kirim klaim</button></div>';
  $('modal').classList.add('show');
  $('m-cancel').onclick = closeModal; $('m-ok').onclick = doSubmit;
}
function doSubmit(){
  var btn = $('m-ok'); btn.disabled = true; btn.textContent = 'Mengirim…'; $('m-cancel').disabled = true;
  var payload = {distributor:head.distributor, area:head.area, periode:head.periode, pengaju:head.pengaju, kontak:head.kontak, code:head.code, mode:mode,
    rows: rows.map(function(r){ return {name:r.name, pay:r.pay, outlets: mode === 'auto' ? [] : r.outlets.filter(filled)}; })};
  if (mode === 'auto') payload.auto = {fileName:AUTO.fileName, fileB64:AUTO.b64, tx:AUTO.tx, first:AUTO.first, dataMin:AUTO.dataMin, dataMax:AUTO.dataMax};
  btn.textContent = mode === 'auto' ? 'Mengirim data & file…' : 'Mengirim…';
  var ok = function(res){ closeModal(); showDone(res); };
  var fail = function(e){ btn.disabled = false; btn.textContent = 'Coba kirim lagi'; $('m-cancel').disabled = false; $('m-err').innerHTML = '<div class="alert bad">'+esc(e && e.message || e)+'</div>'; };
  if (PREVIEW) { setTimeout(function(){ var C = compute(); ok({id:'NOO-PRATINJAU', submitted:C.submitted, valid:C.valid, eligible:C.eligible, total:C.total, totalNet:C.totalNet}); }, 600); return; }
  GS.withSuccessHandler(ok).withFailureHandler(fail).submitKlaim(payload);
}
function showDone(res){
  var dist = head.distributor, per = periodeLabel(head.periode);
  clearAll();
  $('app').innerHTML = '<div class="panel center"><div style="font-size:44px">✓</div><h1>Klaim NOO berhasil dikirim</h1>' +
    '<p class="sub">Simpan nomor klaim berikut untuk konfirmasi ke admin.</p><div class="done-id">'+esc(res.id)+'</div><p>'+esc(dist)+' · '+esc(per)+'</p>' +
    '<table class="sum" style="max-width:440px;margin:16px auto"><tr><td class="l">Outlet diajukan</td><td class="num">'+res.submitted+'</td></tr>' +
    '<tr><td class="l">Outlet valid (cek sistem)</td><td class="num">'+res.valid+'</td></tr><tr><td class="l">Salesman lolos minimal</td><td class="num">'+res.eligible+'</td></tr>' +
    '<tr><td class="l"><b>Estimasi diterima</b></td><td class="num"><b>'+rp(res.totalNet)+'</b></td></tr></table>' +
    '<p class="sub" style="font-size:13px">Nilai final mengikuti hasil verifikasi admin.</p><button class="b primary" id="again">Ajukan klaim baru</button></div>';
  $('again').onclick = function(){ renderShell(); };
  window.scrollTo(0,0);
}
function msgModal(t, m){ $('modal-box').innerHTML = '<h3>'+esc(t)+'</h3><p>'+esc(m)+'</p><div class="row"><button class="b primary" id="m-cancel">OK</button></div>'; $('modal').classList.add('show'); $('m-cancel').onclick = closeModal; }
function closeModal(){ $('modal').classList.remove('show'); }

/* ---------- draft lokal ---------- */
function save(){ setTimeout(refreshSubmit, 0);
  try {
    rememberPays();
    localStorage.setItem(STORE, JSON.stringify({mode:mode, head:head, pays:savedPays, rows: mode === 'manual' ? rows : []}));
  } catch(e){}
}
function load(){
  try {
    var s = JSON.parse(localStorage.getItem(STORE)||'null');
    if (s) { if (s.mode === 'manual' || s.mode === 'auto') mode = s.mode; if (s.pays) savedPays = s.pays; if (s.head) for (var hk in head) head[hk] = s.head[hk] || ''; }
    if (mode === 'auto') { rows = []; return; }
    if (s && Array.isArray(s.rows) && s.rows.length) {
      rows = s.rows.map(function(r){ var b = blank(); b.name = r.name||''; if (r.pay) b.pay = {m:r.pay.m||'own', bank:r.pay.bank||'', cab:r.pay.cab||'', an:r.pay.an||''};
        if (Array.isArray(r.outlets) && r.outlets.length) b.outlets = r.outlets.map(function(o){ return {kode:o.kode||'', nama:o.nama||'', alamat:o.alamat||'', tgl:o.tgl||'', jenis:o.jenis==='R'?'R':'M', last:o.last||''}; });
        return b; });
      if (s.head) for (var k in head) head[k] = s.head[k] || '';
      return;
    }
  } catch(e){}
  rows = [blank()];
}
function clearAll(){ AUTO = null; DET = null; rows = mode === 'manual' ? [blank()] : []; for (var k in head) if (k!=='code') head[k] = ''; save(); }


/* ---------- tombol submit aktif hanya bila data wajib sudah lengkap ---------- */
function refreshSubmit(){
  var btn = document.getElementById('submit');
  if (!btn || !S) return;
  var miss = [];
  try { miss = missing(); } catch (e) { miss = []; }
  btn.disabled = miss.length > 0;
  btn.title = miss.length ? 'Lengkapi: ' + miss.join('; ') : '';
  var hint = document.getElementById('submit-hint');
  if (!hint) {
    hint = document.createElement('div');
    hint.id = 'submit-hint';
    hint.style.cssText = 'flex:1;min-width:220px;text-align:right;font-size:12.5px;font-weight:600;color:var(--warn)';
    btn.parentNode.insertBefore(hint, btn);
  }
  hint.textContent = miss.length ? 'Lengkapi dulu: ' + miss.slice(0, 3).join('; ') + (miss.length > 3 ? ' (+' + (miss.length - 3) + ' lainnya)' : '') : '';
}
function blankStr(x){ return !String(x == null ? '' : x).trim(); }

function missing(){
  var m = [];
  if (blankStr(head.distributor)) m.push('nama distributor');
  if (blankStr(head.periode)) m.push('periode');
  if (blankStr(head.pengaju)) m.push('nama pengaju');
  if (S.needCode && blankStr(head.code)) m.push('kode akses');
  if (mode === 'auto') {
    if (!AUTO) m.push('file data transaksi');
    else {
      if (AUTO.dataMin > dataStartNeeded(head.periode, S) || AUTO.dataMax < head.periode + '-01') m.push('data transaksi yang mencakup periode');
      if (!rows.length) m.push('outlet NOO terdeteksi di periode');
    }
  } else {
    var tot = 0;
    rows.forEach(function(r, i){
      var f = r.outlets.filter(filled); tot += f.length;
      if (blankStr(r.name)) m.push('nama salesman ' + (i + 1));
      var inc = f.filter(function(o){ return blankStr(o.kode) || blankStr(o.nama) || !o.tgl; }).length;
      if (inc) m.push((r.name.trim() || 'salesman ' + (i + 1)) + ' (' + inc + ' outlet belum lengkap)');
    });
    if (!tot) m.push('minimal 1 outlet NOO');
  }
  return m;
}

start();
</script>
